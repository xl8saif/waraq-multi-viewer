name: Waraq Multi-Viewer QA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    name: Static HTML/JS QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate entries and inline JavaScript
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const index = fs.readFileSync('index.html', 'utf8');
          const multi = fs.readFileSync('multiview.html', 'utf8');

          if (index !== multi) {
            console.error('index.html and multiview.html are not identical.');
            process.exit(1);
          }

          if (/\\n@keyframes/.test(index)) {
            console.error('Malformed literal \\n before @keyframes remains.');
            process.exit(1);
          }

          for (const name of ['rainbowFlow','shinePulse']) {
            if (!new RegExp('@keyframes\\s+' + name + '\\{[\\s\\S]*?\\}\\s*\\}').test(index)) {
              console.error('Malformed ' + name + ' keyframes block.');
              process.exit(1);
            }
          }

          const scripts = [];
          for (const part of index.split('<script').slice(1)) {
            const openEnd = part.indexOf('>');
            const close = part.indexOf('</script>');
            if (openEnd >= 0 && close > openEnd) scripts.push(part.slice(openEnd + 1, close));
          }
          if (!scripts.length) {
            console.error('No inline JavaScript found.');
            process.exit(1);
          }
          for (const script of scripts) {
            try { new Function(script); }
            catch (error) {
              console.error('JavaScript syntax error:', error);
              process.exit(1);
            }
          }

          const requiredIds = [
            'urls','layers','pane-count','mode','quality','load','refresh',
            'play','stop','mute','clear','status','history','history-list',
            'restore','clear-history','grid'
          ];
          for (const id of requiredIds) {
            if (!new RegExp('id=["\\']' + id + '["\\']').test(index)) {
              console.error('Missing required element id:', id);
              process.exit(1);
            }
          }

          const shaIndex = crypto.createHash('sha256').update(index).digest('hex');
          console.log('Static QA passed. HTML SHA-256:', shaIndex);
          NODE

  browser-qa:
    name: Published-site browser QA
    runs-on: ubuntu-latest
    needs: static-qa
    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Open published site and verify
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const url = 'https://xl8saif.github.io/waraq-multi-viewer/';
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({viewport: {width: 1440, height: 1000}});

            const consoleErrors = [];
            const failedRequests = [];

            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', err => consoleErrors.push('PAGEERROR: ' + err.message));
            page.on('requestfailed', req => {
              const u = req.url();
              if (!u.startsWith('data:')) failedRequests.push(req.method() + ' ' + u + ' :: ' + (req.failure()?.errorText || 'failed'));
            });

            const response = await page.goto(url, {waitUntil: 'domcontentloaded', timeout: 30000});
            if (!response || !response.ok()) {
              throw new Error('Published site unavailable: HTTP ' + (response ? response.status() : 'no response'));
            }

            await page.waitForSelector('h1', {timeout: 15000});
            await page.waitForSelector('#urls', {timeout: 15000});
            await page.waitForSelector('#load', {timeout: 15000});

            const title = await page.locator('h1').first().textContent();
            const bodyText = await page.locator('body').innerText();

            if (!title || !title.includes('Waraq Multi-Viewer Platform')) {
              throw new Error('Unexpected page title/hero.');
            }
            for (const label of ['Load panes','Play all','Stop all','Mute all','Clear','QA LAYERS']) {
              if (!bodyText.includes(label)) throw new Error('Missing UI control: ' + label);
            }

            await page.locator('#urls').fill('https://www.youtube.com/watch?v=M7lc1UVf-VE');
            await page.locator('#layers').fill('1');
            await page.locator('#load').click();
            await page.waitForSelector('.pane', {timeout: 15000});

            const paneCount = await page.locator('.pane').count();
            if (paneCount !== 1) throw new Error('Expected 1 test pane, got ' + paneCount);

            await page.waitForTimeout(2500);

            if (consoleErrors.length) {
              throw new Error('Browser console errors:\\n' + consoleErrors.join('\\n'));
            }

            console.log(JSON.stringify({
              url,
              httpStatus: response.status(),
              paneCount,
              consoleErrors,
              failedRequests
            }, null, 2));

            await browser.close();
          })().catch(async error => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE
