name: Build Waraq Multi-Viewer APK

on:
  push:
    branches: ["main"]
    paths:
      - "multiview.html"
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Prepare web asset
        run: mkdir -p android/app/src/main/assets && cp multiview.html android/app/src/main/assets/multiview.html
      - name: Build debug APK
        working-directory: android
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Waraq-Multi-Viewer.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waraq-Multi-Viewer-APK
          path: Waraq-Multi-Viewer.apk
      - name: Upload APK to release-style artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waraq-Multi-Viewer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
